<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SubTrack | Subscription Manager</title>

    <link rel="stylesheet" href="css/style.css">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>

<div class="auth-container">

    <div class="brand-section">

        <div class="logo">
            S
        </div>

        <h1>SubTrack</h1>

        <p>
            Track your subscriptions.
            Control your spending.
        </p>

        <div class="features">

            <div>
                <span>✓</span>
                Track recurring payments
            </div>

            <div>
                <span>✓</span>
                Monitor monthly expenses
            </div>

            <div>
                <span>✓</span>
                Discover spending patterns
            </div>

        </div>

    </div>


    <div class="auth-card">

        <div class="tabs">

            <button
                id="loginTab"
                class="tab active"
                onclick="showLogin()">
                Login
            </button>

            <button
                id="registerTab"
                class="tab"
                onclick="showRegister()">
                Register
            </button>

        </div>


        <!-- LOGIN -->

        <form id="loginForm">

            <h2>Welcome back</h2>

            <p class="subtitle">
                Login to manage your subscriptions
            </p>

            <label>Email</label>

            <input
                type="email"
                id="loginEmail"
                placeholder="you@example.com"
                required
            >

            <label>Password</label>

            <input
                type="password"
                id="loginPassword"
                placeholder="••••••••"
                required
            >

            <button class="primary-btn" type="submit">
                Login
            </button>

            <p id="loginMessage" class="message"></p>

        </form>


        <!-- REGISTER -->

        <form id="registerForm" class="hidden">

            <h2>Create account</h2>

            <p class="subtitle">
                Start tracking your subscriptions
            </p>

            <label>Name</label>

            <input
                type="text"
                id="registerName"
                placeholder="Your name"
                required
            >

            <label>Email</label>

            <input
                type="email"
                id="registerEmail"
                placeholder="you@example.com"
                required
            >

            <label>Password</label>

            <input
                type="password"
                id="registerPassword"
                placeholder="Minimum 6 characters"
                minlength="6"
                required
            >

            <button class="primary-btn" type="submit">
                Create Account
            </button>

            <p id="registerMessage" class="message"></p>

        </form>

    </div>

</div>


<script src="js/supabase.js"></script>
<script src="js/auth.js"></script>

</body>
</html>
